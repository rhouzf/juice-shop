name: CI Pipeline - DevSecOps

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

env:
  TRIVY_VERSION: "v0.69.3"          # Version épinglée suite à l'incident de sécurité
  IMAGE_NAME: "juice-shop:latest"    # sur trivy-action (avril 2026) 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet nécessaire pour Gitleaks

      # ------------------------------------------------------------------
      # 1. SECRET SCANNING
      # ------------------------------------------------------------------
      - name: Installer Gitleaks CLI
        run: |
          GITLEAKS_VERSION=$(curl -s "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" | grep -Po '"tag_name": "v\K[0-9.]+')
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
          gitleaks version


      - name:  Scan complet du repo
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --verbose \
            --exit-code 0 \
            --report-format json \
            --report-path gitleaks-report.json

      # ------------------------------------------------------------------
      # 2. BUILD
      # ------------------------------------------------------------------
      - name: Build de l'image Docker
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Vérifier que l'image existe
        run: docker images | grep juice-shop

      # ------------------------------------------------------------------
      # 3. INSTALLATION DE TRIVY (version épinglée, pas @master)
      # ------------------------------------------------------------------
      - name: Installer Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/${{ env.TRIVY_VERSION }}/contrib/install.sh \
            | sh -s -- -b /usr/local/bin ${{ env.TRIVY_VERSION }}
          trivy --version

      # ------------------------------------------------------------------
      # 4. SCAN DE VULNÉRABILITÉS (SARIF pour GitHub Security tab)
      # ------------------------------------------------------------------
      - name: Scan de vulnérabilités (SARIF)
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}
          # exit-code 0 = mode "reporting only" (Phase 1).
          # Phase 2 prévue : passer à 1 une fois la baseline de vulnérabilités connues traitée.

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # ------------------------------------------------------------------
      # DÉMARRAGE DE L'APPLICATION POUR ZAP
      # ------------------------------------------------------------------
      - name: Démarrer Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            juice-shop:latest
      
      - name: Vérifier que l'application est disponible
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "Juice Shop est disponible"
              exit 0
            fi
            echo "En attente de Juice Shop..."
            sleep 2
          done
          echo "L'application n'est pas disponible"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          artifact_name: 'zap-report'

      
      # ------------------------------------------------------------------
      # 5. SCAN DE VULNÉRABILITÉS (JSON brut, pour le rapport de compliance)
      # ------------------------------------------------------------------
      - name: Scan de vulnérabilités (JSON)
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --format json \
            --output trivy-report.json \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}

      # ------------------------------------------------------------------
      # 6. COMPLIANCE - CIS Docker Community Edition Benchmark
      # ------------------------------------------------------------------
      - name: Scan de compliance CIS Docker (résumé lisible)
        run: |
          trivy image --compliance docker-cis-1.6.0 --report summary --exit-code 0 ${{ env.IMAGE_NAME }}

      - name: Scan de compliance CIS Docker (JSON complet)
        run: |
          trivy image \
            --compliance docker-cis-1.6.0 \
            --report all \
            --format json \
            --output compliance-cis-report.json \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}

      # ------------------------------------------------------------------
      # 7. SCA - AUDIT DES DÉPENDANCES NPM
      # ------------------------------------------------------------------
      - name: SCA - Audit des dépendances npm (lisible dans les logs)
        run: npm audit --audit-level=high || true
        # || true : mode "reporting only" en phase de découverte (même logique que Trivy ci-dessus)

      - name: SCA - Audit des dépendances npm (JSON pour le rapport)
        run: npm audit --json > npm-audit-report.json || true

      # ------------------------------------------------------------------
      # 8. PUBLICATION DES RAPPORTS (artifacts téléchargeables)
      # ------------------------------------------------------------------
      - name: Upload des rapports de sécurité et de compliance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-and-compliance-reports
          path: |
            gitleaks-report.json
            trivy-report.json
            trivy-results.sarif
            compliance-cis-report.json
            npm-audit-report.json
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
